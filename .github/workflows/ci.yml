name: Pruebas y build

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Instalar dependencias fijadas
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Comprobar formato
        run: npm run format:check
      - name: Pruebas Node
        run: npm test
      - name: Compilar aplicación y recursos locales
        run: npm run build
      - name: Instalar Chromium y dependencias en el runner
        run: npx --no-install playwright install --with-deps chromium
      - name: Pruebas E2E Chromium
        run: npm run test:e2e

  pages-build:
    needs: test-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TURNOS_BASE_PATH: /turnos-en-comun/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: pages-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefacto validado
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
